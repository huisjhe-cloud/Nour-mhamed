<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>دعوة فرح – Nour & Mohamed</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Great+Vibes&family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3e6e1;--ink:#4a3a35;--gold:#b88a3e;--gold2:#e2c27d;--card:#fffaf5;--rose:#d9a0a0;--rose2:#f0c9c6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1214}}
:root[data-theme="dark"]{--bg:#1a1214}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);display:flex;justify-content:center;padding:24px 14px;font-family:'Cairo',Tahoma,sans-serif;color:var(--ink)}
.card{position:relative;width:100%;max-width:440px;background:radial-gradient(circle at 50% 0,#fff 0,var(--card) 60%,#f7ebe3 100%);border-radius:6px;padding:56px 28px 52px;text-align:center;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.25)}
.card::before{content:"";position:absolute;inset:12px;border:1.5px solid var(--gold);border-radius:2px;pointer-events:none}
.card::after{content:"";position:absolute;inset:18px;border:.5px solid var(--gold2);pointer-events:none}
.fl{position:absolute;width:150px;height:150px;opacity:.95}
.tl{top:-34px;left:-34px}.br{bottom:-34px;right:-34px;transform:rotate(180deg)}
.tr{top:-40px;right:-40px;transform:scaleX(-1) scale(.8)}.bl{bottom:-40px;left:-40px;transform:scaleY(-1) scale(.8)}
.bism{font-size:15px;color:var(--gold);letter-spacing:.5px;position:relative}
.inv{font-size:15px;margin:22px 0 6px;color:var(--ink);position:relative}
.names{font-family:'Great Vibes','Brush Script MT',cursive;font-size:64px;line-height:1.05;margin:10px 0 0;color:var(--gold);direction:ltr;position:relative;
background:linear-gradient(180deg,var(--gold2),var(--gold) 70%);-webkit-background-clip:text;background-clip:text;color:transparent}
.amp{display:block;font-family:'Cormorant Garamond',Georgia,serif;font-size:26px;color:var(--rose);-webkit-text-fill-color:var(--rose);margin:-2px 0}
.div{margin:22px auto;width:200px;position:relative}
.sat{font-size:30px;font-weight:700;color:var(--ink);position:relative;margin:4px 0 0}
.sat small{display:block;font-family:'Cormorant Garamond',Georgia,serif;font-size:15px;letter-spacing:6px;color:var(--gold);font-weight:600;margin-top:2px}
.line{font-size:17px;line-height:2;margin:16px 0 0;position:relative}
.chips{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:22px;position:relative}
.chip{border:1px solid var(--gold);border-radius:999px;padding:7px 18px;font-size:15px;font-weight:600;color:#7a5a22;background:linear-gradient(#fffdf8,#f8ecd6)}
.foot{margin-top:28px;font-size:14px;color:var(--gold);position:relative}
.venue{margin-top:24px;position:relative;direction:ltr}
.venue small{display:block;font-family:'Cormorant Garamond',Georgia,serif;font-size:13px;letter-spacing:6px;color:var(--gold);font-weight:600}
.venue b{display:block;font-family:'Cormorant Garamond',Georgia,serif;font-size:36px;font-weight:600;color:var(--ink);line-height:1.15;margin-top:4px}
.venue span{display:block;font-family:'Cormorant Garamond',Georgia,serif;font-size:21px;letter-spacing:3px;color:var(--gold);margin-top:2px}
#rain{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
.p{position:absolute;top:-8vh;will-change:transform;animation:fall linear forwards}
.p i{display:block;border-radius:150% 0 150% 0;animation:spin ease-in-out infinite alternate}
.p.e{font-size:22px;line-height:1}
@keyframes fall{to{transform:translate3d(var(--dx),112vh,0)}}
@keyframes spin{from{transform:rotate3d(1,1,0,0deg) rotate(0)}to{transform:rotate3d(1,1,0,160deg) rotate(80deg)}}
@media (prefers-reduced-motion:reduce){#rain{display:none}}
#cover{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;text-align:center;background:radial-gradient(circle at 50% 30%,#fff7ef,#f0d4cf 70%,#e5bfb9);transition:opacity .9s ease,visibility .9s;padding:24px}
#cover.gone{opacity:0;visibility:hidden}
#cover .mono{font-family:'Great Vibes','Brush Script MT',cursive;font-size:84px;color:#b88a3e;line-height:1}
#cover p{font-family:'Cormorant Garamond',Georgia,serif;font-size:20px;letter-spacing:6px;color:#7a5a22;margin:10px 0 28px;text-transform:uppercase}
#open{font-family:'Cairo',Tahoma,sans-serif;font-size:18px;font-weight:700;color:#fff;background:linear-gradient(135deg,#c99a4a,#a97a2c);border:0;border-radius:999px;padding:13px 38px;box-shadow:0 8px 24px rgba(150,100,30,.4);animation:pulse 1.8s infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
#mus{position:fixed;z-index:60;top:calc(env(safe-area-inset-top,0px) + 12px);left:12px;width:44px;height:44px;border-radius:50%;border:1px solid #b88a3e;background:#fffaf5;font-size:20px}
#mus.off{opacity:.55}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
<defs>
<g id="bloom">
<g fill="#d9a0a0"><ellipse cx="0" cy="-22" rx="11" ry="22"/><ellipse cx="0" cy="-22" rx="11" ry="22" transform="rotate(60)"/><ellipse cx="0" cy="-22" rx="11" ry="22" transform="rotate(120)"/><ellipse cx="0" cy="-22" rx="11" ry="22" transform="rotate(180)"/><ellipse cx="0" cy="-22" rx="11" ry="22" transform="rotate(240)"/><ellipse cx="0" cy="-22" rx="11" ry="22" transform="rotate(300)"/></g>
<g fill="#f0c9c6"><ellipse cx="0" cy="-15" rx="8" ry="15" transform="rotate(30)"/><ellipse cx="0" cy="-15" rx="8" ry="15" transform="rotate(90)"/><ellipse cx="0" cy="-15" rx="8" ry="15" transform="rotate(150)"/><ellipse cx="0" cy="-15" rx="8" ry="15" transform="rotate(210)"/><ellipse cx="0" cy="-15" rx="8" ry="15" transform="rotate(270)"/><ellipse cx="0" cy="-15" rx="8" ry="15" transform="rotate(330)"/></g>
<circle r="7" fill="#e2c27d"/><circle r="3" fill="#b88a3e"/>
</g>
<g id="corner">
<path d="M10 140 C40 100 60 70 100 40" stroke="#7d9a6e" stroke-width="2.5" fill="none"/>
<g fill="#8fae80"><ellipse cx="38" cy="108" rx="14" ry="6" transform="rotate(-50 38 108)"/><ellipse cx="62" cy="78" rx="14" ry="6" transform="rotate(-40 62 78)"/><ellipse cx="86" cy="56" rx="12" ry="5" transform="rotate(-30 86 56)"/><ellipse cx="22" cy="128" rx="10" ry="5" transform="rotate(-70 22 128)"/></g>
<use href="#bloom" transform="translate(58 58) scale(1.15)"/>
<use href="#bloom" transform="translate(110 30) scale(.6)"/>
<use href="#bloom" transform="translate(26 112) scale(.55)"/>
<circle cx="92" cy="92" r="3" fill="#e2c27d"/><circle cx="120" cy="64" r="2.5" fill="#e2c27d"/><circle cx="64" cy="124" r="2.5" fill="#e2c27d"/>
</g>
</defs>
</svg>

<div id="cover"><div><div class="mono">N &amp; M</div><p>Wedding Invitation</p><button id="open" type="button">فتح الدعوة 💌</button></div></div>
<audio id="song" loop preload="auto"></audio>
<button id="mus" type="button" hidden aria-label="music">🎵</button>
<div id="rain" aria-hidden="true"></div>
<main class="card">
<svg class="fl tl" viewBox="0 0 150 150"><use href="#corner"/></svg>
<svg class="fl tr" viewBox="0 0 150 150"><use href="#corner"/></svg>
<svg class="fl bl" viewBox="0 0 150 150"><use href="#corner"/></svg>
<svg class="fl br" viewBox="0 0 150 150"><use href="#corner"/></svg>

<div class="bism">بسم الله الرحمن الرحيم</div>
<p class="inv">يتشرف أهل العروسين بدعوتكم لحضور حفل زفاف</p>

<h1 class="names">Nour<span class="amp">&amp;</span>Mohamed</h1>

<svg class="div" viewBox="0 0 200 24" aria-hidden="true">
<line x1="0" y1="12" x2="78" y2="12" stroke="#b88a3e" stroke-width="1"/><line x1="122" y1="12" x2="200" y2="12" stroke="#b88a3e" stroke-width="1"/>
<use href="#bloom" transform="translate(100 12) scale(.42)"/>
</svg>

<p class="sat">يوم السبت<small>SATURDAY</small></p>


<div class="chips"></div>

<div class="venue"><small>📍 VENUE</small><b>Crystal Hall</b><span>Abu Kabeer</span></div>

<div class="foot">بحضوركم تكتمل فرحتنا</div>
</main>
<script>
(function(){
  var rain=document.getElementById('rain');
  var cols=['#d9a0a0','#e8b4b0','#f0c9c6','#c97b84','#f7dcd8','#e2c27d'];
  function r(a,b){return a+Math.random()*(b-a)}
  function drop(delay){
    var p=document.createElement('div');
    var emoji=Math.random()<0.12;
    p.className='p'+(emoji?' e':'');
    var dur=r(6,11);
    p.style.left=r(-2,100)+'vw';
    p.style.setProperty('--dx',r(-18,18)+'vw');
    p.style.animationDuration=dur+'s';
    p.style.animationDelay=(delay||0)+'s';
    if(emoji){p.textContent=['🌹','🌸','🌷'][Math.floor(Math.random()*3)];p.style.fontSize=r(18,28)+'px';}
    else{
      var i=document.createElement('i');var s=r(9,18);
      i.style.width=s+'px';i.style.height=s*1.25+'px';
      i.style.background='linear-gradient(135deg,'+cols[Math.floor(Math.random()*cols.length)]+',#fff3 140%)';
      i.style.animationDuration=r(1.2,2.6)+'s';
      p.appendChild(i);
    }
    rain.appendChild(p);
    setTimeout(function(){p.remove()},(dur+(delay||0))*1000+200);
  }
  var cover=document.getElementById('cover'),song=document.getElementById('song'),mus=document.getElementById('mus');
  function start(){
    cover.classList.add('gone');
    for(var k=0;k<46;k++)drop(r(0,4));
    setInterval(function(){if(!document.hidden)drop(0)},380);
    if(song.getAttribute('src')){mus.hidden=false;song.play().catch(function(){mus.classList.add('off')});}
  }
  document.getElementById('open').addEventListener('click',start);
  mus.addEventListener('click',function(){
    if(song.paused){song.play();mus.classList.remove('off')}else{song.pause();mus.classList.add('off')}
  });
})();
</script>
</body>
</html>
